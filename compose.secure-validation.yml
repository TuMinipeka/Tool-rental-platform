services:
  secure-backend:
    profiles: [security]
    image: tool-rental-mvp-backend:working
    environment:
      SPRING_PROFILES_ACTIVE: production,showcase
      SHOWCASE_DATABASE_NAME: mvp_showcase
      DB_URL: jdbc:postgresql://postgres:5432/mvp_showcase
      DB_USERNAME: mvp_validation
      DB_PASSWORD: ${MVP_DB_PASSWORD}
      JWT_SECRET: ${MVP_JWT_SECRET}
      CORS_ALLOWED_ORIGINS: https://localhost:18443
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USERNAME: unused-private-validation
      SMTP_PASSWORD: unused-private-validation
      PASSWORD_RECOVERY_SENDER: evaluator@example.test
      PASSWORD_RECOVERY_RESET_URL: https://localhost:18443/password-reset
    ports: ["127.0.0.1:18081:8080"]
    depends_on:
      postgres: { condition: service_healthy }
