services:
  secure-backend:
    profiles: [security]
    image: tool-rental-mvp-backend:working
    environment:
      SPRING_PROFILES_ACTIVE: production,showcase
      SHOWCASE_DATABASE_NAME: mvp_integrated_showcase
      DB_URL: jdbc:postgresql://postgres:5432/mvp_integrated_showcase
      DB_USERNAME: mvp_validation
      DB_PASSWORD: ${MVP_DB_PASSWORD}
      JWT_SECRET: ${MVP_JWT_SECRET}
      CORS_ALLOWED_ORIGINS: https://localhost:18443
      PAYMENT_PROVIDER: fictional
      MERCADOPAGO_ACCESS_TOKEN: ${MVP_MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_COLLECTOR_ID: ${MVP_MERCADOPAGO_COLLECTOR_ID:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MVP_MERCADOPAGO_WEBHOOK_SECRET:-}
      PAYMENTS_PUBLIC_URL: ${MVP_PAYMENTS_PUBLIC_URL:-}
    ports: ["127.0.0.1:18081:8080"]
    depends_on:
      postgres: { condition: service_healthy }
