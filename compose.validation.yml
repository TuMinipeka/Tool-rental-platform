name: tool-rental-mvp
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: mvp_validation
      POSTGRES_USER: mvp_validation
      POSTGRES_PASSWORD: ${MVP_DB_PASSWORD:?Set isolated validation password}
    volumes: ["mvp_data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mvp_validation -d mvp_validation']
      interval: 3s
      timeout: 5s
      retries: 30
  backend:
    image: tool-rental-mvp-backend:working
    build: { context: ., dockerfile: Dockerfile }
    environment:
      SPRING_PROFILES_ACTIVE: local,demo
      DB_URL: jdbc:postgresql://postgres:5432/${MVP_DB_NAME:-mvp_validation}
      DB_USERNAME: mvp_validation
      DB_PASSWORD: ${MVP_DB_PASSWORD}
      SANDBOX_WEBHOOK_SECRET: ${MVP_SANDBOX_SECRET:?Set private sandbox verifier secret}
      JWT_SECRET: ${MVP_JWT_SECRET:?Set validation JWT secret}
      CORS_ALLOWED_ORIGINS: http://localhost:15173
      PASSWORD_RECOVERY_RESET_URL: http://localhost:15173/password-reset
      PASSWORD_RECOVERY_DELIVERY: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports: ["127.0.0.1:18080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
  frontend:
    image: tool-rental-mvp-frontend:working
    build:
      context: ./frontend
      args: { VITE_API_BASE_URL: "", VITE_DEMO_MODE: "false", VITE_REQUIRE_LIVE_API: "true" }
  proxy:
    image: caddy:2.11.2-alpine
    ports: ["127.0.0.1:15173:80"]
    volumes: ["./ops/Caddyfile.local:/etc/caddy/Caddyfile:ro"]
    depends_on: [backend,frontend]
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:18025:8025"]
volumes:
  mvp_data: {}
