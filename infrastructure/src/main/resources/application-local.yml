spring:
  config:
    activate:
      on-profile: local
  datasource:
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:2}
      minimum-idle: ${DB_MIN_IDLE:0}
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tool_rental}
    username: ${DB_USERNAME:tool_rental}
    password: ${DB_PASSWORD:tool_rental}
    driver-class-name: org.postgresql.Driver
