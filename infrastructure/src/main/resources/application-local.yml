spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/demo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tool_rental}
    username: ${DB_USERNAME:tool_rental}
    password: ${DB_PASSWORD:tool_rental}
    driver-class-name: org.postgresql.Driver
