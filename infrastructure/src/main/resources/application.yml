spring:
  application:
    name: tool-rental-platform
  profiles:
    default: local
  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}

auth:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-before-production-2026}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    password-reset-ttl: ${JWT_PASSWORD_RESET_TTL:PT15M}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
