spring:
  application:
    name: tool-rental-platform
  profiles:
    default: local
  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}

auth:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-before-production-2026}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${AUTH_REFRESH_TTL:P30D}
    refresh-reuse-grace: ${AUTH_REFRESH_REUSE_GRACE:PT10S}
  cookie:
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  password-recovery:
    delivery: ${PASSWORD_RECOVERY_DELIVERY:disabled}
    ttl: ${PASSWORD_RESET_TTL:PT15M}
    sender: ${PASSWORD_RECOVERY_SENDER:no-reply@toolrental.local}
    reset-url: ${PASSWORD_RECOVERY_RESET_URL:http://localhost:5173/password-reset}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

payments:
  sandbox:
    webhook-secret: ${SANDBOX_WEBHOOK_SECRET:local-sandbox-webhook-secret-change-me-2026}

spring.mail:
  host: ${SMTP_HOST:localhost}
  port: ${SMTP_PORT:1025}
  username: ${SMTP_USERNAME:}
  password: ${SMTP_PASSWORD:}
  properties.mail.smtp:
    auth: ${SMTP_AUTH:false}
    starttls.enable: ${SMTP_STARTTLS:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
  cache:
    max-entries: 20
